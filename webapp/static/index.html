<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Databricks Cost Audit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 22l6-6 4 4 6-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.lang = localStorage.getItem("lang") || "en";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/docs/README.md"><span class="logo">Δ</span><span id="brand-name">Databricks Cost Audit</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="switch" id="lang-switch" title="Language / Язык">
      <button data-lang="en">EN</button><button data-lang="ru">RU</button>
    </div>
    <div class="switch" id="theme-switch" title="Theme / Тема">
      <button data-theme="light">☀</button><button data-theme="dark">☾</button>
    </div>
  </header>
  <main id="app"></main>
  <div class="toast-host" id="toasts"></div>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
